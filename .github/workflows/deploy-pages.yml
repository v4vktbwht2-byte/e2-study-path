name: GitHub Pagesへ公開

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Pages成果物を生成
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm

      - name: 依存関係をクリーンインストール
        run: npm ci

      - name: 公開ベースパスを設定
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository_name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository_name}/"
          fi
          echo "VITE_BASE_PATH=${base_path}" >> "${GITHUB_ENV}"
          echo "公開ベースパス: ${base_path}"

      - name: 本番ビルド
        run: npm run build

      - name: Pages成果物を検証
        run: npm run verify:dist

      - name: Pages成果物を保存
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: GitHub Pagesへ反映
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: GitHub Pagesへ反映
        id: deployment
        uses: actions/deploy-pages@v4
