name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静的解析・単体テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm

      - name: 依存関係をクリーンインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: 単体・コンポーネントテスト
        run: npm run test

      - name: テストカバレッジ
        run: npm run test:coverage

      - name: 教材コンテンツ検証
        run: npm run validate:content

      - name: 本番ビルド
        run: npm run build

      - name: 本番成果物を検証
        run: npm run verify:dist

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm

      - name: 依存関係をクリーンインストール
        run: npm ci

      - name: Chromiumとシステム依存関係を準備
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: 失敗時のPlaywright成果物を保存
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
